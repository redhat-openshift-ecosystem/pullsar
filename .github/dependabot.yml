---
# Group dependency updates within each ecosystem into a single weekly PR.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/apps/api"
      - "/apps/worker"
    schedule:
      # Check for updates to Python dependencies every week
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/worker"
      - "/apps/web"
    schedule:
      # Check for updates to Docker images every week
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
